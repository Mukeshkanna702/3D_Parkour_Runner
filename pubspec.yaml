name: skyrush_neon_escape
description: "SkyRush: Neon Escape - AAA Cyberpunk 3D Parkour Runner Game UI Built in Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management & Architecture
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.7
  
  # Routing & Navigation
  go_router: ^13.2.0
  
  # UI & Animations
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  
  # Network & Data
  dio: ^5.4.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
